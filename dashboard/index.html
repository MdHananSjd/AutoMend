<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoMend — Incident Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#09090b;color:#e4e4e7}
    .bg-grid{background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(34,197,94,.06),transparent),radial-gradient(circle at 1px 1px,rgba(255,255,255,.03) 1px,transparent 0);background-size:100% 100%,24px 24px}
    @keyframes beacon-pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
    .beacon{animation:beacon-pulse 2s ease-in-out infinite}
    @keyframes radar-sweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .radar-sweep{animation:radar-sweep 3s linear infinite}
    @keyframes fade-in-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade-in{animation:fade-in-up .3s ease-out forwards}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .shimmer-active{background-size:200% 100%;animation:shimmer 2s linear infinite}
    .step-bar{transition:width .8s cubic-bezier(.4,0,.2,1)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .animate-spin{animation:spin 1s linear infinite}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#27272a;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#3f3f46}
    .json-key{color:#a78bfa}.json-string{color:#34d399}.json-number{color:#f59e0b}.json-bool{color:#f472b6}.json-null{color:#6b7280}
  </style>
</head>
<body class="bg-grid min-h-screen">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-xl">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2.5">
            <div class="relative"><div class="h-2.5 w-2.5 rounded-full bg-emerald-500 beacon"></div><div class="absolute inset-0 h-2.5 w-2.5 rounded-full bg-emerald-400 opacity-40"></div></div>
            <span class="text-sm font-semibold tracking-tight text-zinc-100">AutoMend</span>
          </div>
          <span class="hidden sm:inline-flex items-center rounded-full border border-zinc-800 bg-zinc-900/50 px-2.5 py-0.5 text-[11px] font-medium text-zinc-400">Autonomous Self-Healing Active</span>
        </div>
        <div class="flex items-center gap-2">
          <a href="https://automend-target-247530183292.us-central1.run.app/health" target="_blank"
             class="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-zinc-800 bg-zinc-900/50 px-3 py-1.5 text-xs font-mono text-zinc-400 hover:border-zinc-700 hover:text-zinc-300 transition-colors">
            <i data-lucide="cloud" class="h-3 w-3"></i>automend-target<i data-lucide="external-link" class="h-3 w-3 opacity-40"></i>
          </a>
          <!-- Show History Toggle -->
          <button id="btn-history" onclick="toggleHistory()"
            class="rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] font-medium text-zinc-500 hover:border-zinc-700 hover:text-zinc-400 transition-all"
            title="Show all incidents (including old)">
            <i data-lucide="history" class="h-3 w-3"></i>
          </button>
          <!-- Trigger: Error Spike -->
          <button id="btn-error-spike" onclick="triggerFailure('error-spike')"
            class="group relative rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] font-medium text-zinc-400 hover:border-amber-800/50 hover:bg-amber-500/5 hover:text-amber-400 transition-all disabled:opacity-40 disabled:cursor-wait"
            title="Trigger error-rate spike">
            <i data-lucide="zap" class="h-3 w-3 group-hover:hidden"></i>
            <i data-lucide="loader-2" class="h-3 w-3 hidden group-hover:block animate-spin"></i>
          </button>
          <!-- Trigger: Reset -->
          <button id="btn-reset" onclick="triggerFailure('reset')"
            class="group relative rounded-lg border border-zinc-800 bg-zinc-900/50 px-2.5 py-1.5 text-[11px] font-medium text-zinc-400 hover:border-emerald-800/50 hover:bg-emerald-500/5 hover:text-emerald-400 transition-all disabled:opacity-40 disabled:cursor-wait"
            title="Reset to healthy state">
            <i data-lucide="rotate-ccw" class="h-3 w-3 group-hover:hidden"></i>
            <i data-lucide="loader-2" class="h-3 w-3 hidden group-hover:block animate-spin"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 pt-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 backdrop-blur-sm px-4 py-3">
        <div class="text-[11px] font-medium uppercase tracking-wider text-zinc-500">Active</div>
        <div class="mt-1 text-2xl font-semibold text-zinc-100" id="stat-active">0</div>
      </div>
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 backdrop-blur-sm px-4 py-3">
        <div class="text-[11px] font-medium uppercase tracking-wider text-zinc-500">Recovery Rate</div>
        <div class="mt-1 text-2xl font-semibold text-emerald-400" id="stat-recovery">&mdash;</div>
      </div>
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 backdrop-blur-sm px-4 py-3">
        <div class="text-[11px] font-medium uppercase tracking-wider text-zinc-500">Avg. Heal Time</div>
        <div class="mt-1 text-2xl font-semibold text-zinc-100" id="stat-heal-time">&mdash;</div>
      </div>
      <div class="rounded-xl border border-zinc-800/80 bg-zinc-900/50 backdrop-blur-sm px-4 py-3">
        <div class="text-[11px] font-medium uppercase tracking-wider text-zinc-500">Revisions</div>
        <div class="mt-1 text-2xl font-semibold text-zinc-100" id="stat-revisions">0</div>
      </div>
    </div>
  </div>

  <!-- INCIDENT FEED -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
    <div id="empty-state" class="flex flex-col items-center justify-center py-24">
      <div class="relative h-32 w-32 mb-6">
        <svg class="h-full w-full" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(34,197,94,0.1)" stroke-width="1"/>
          <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
          <circle cx="64" cy="64" r="24" fill="none" stroke="rgba(34,197,94,0.06)" stroke-width="1"/>
          <line x1="64" y1="64" x2="64" y2="8" stroke="rgba(34,197,94,0.3)" stroke-width="1.5" stroke-linecap="round" class="radar-sweep" style="transform-origin:64px 64px"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center"><div class="h-2 w-2 rounded-full bg-emerald-500 beacon"></div></div>
      </div>
      <p class="text-sm text-zinc-500 font-medium">Monitoring Cloud Run telemetry...</p>
      <p class="text-xs text-zinc-600 mt-1">All systems healthy</p>
    </div>
    <div id="incidents-container" class="space-y-3 hidden"></div>
  </main>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 pointer-events-none">
    <div id="toast-inner" class="rounded-xl border border-zinc-800 bg-zinc-900/90 backdrop-blur-xl px-4 py-3 shadow-2xl flex items-center gap-2 text-sm text-zinc-300 opacity-0 translate-y-2 transition-all duration-300">
      <span id="toast-icon"></span>
      <span id="toast-text"></span>
    </div>
  </div>

<script>
// ═══════════ FIREBASE ═══════════
firebase.initializeApp({
  apiKey:"AIzaSyARIULZpu714_Qw0IC72yPIz0Kg3eHEIbE",
  authDomain:"automend-hackathon.firebaseapp.com",
  projectId:"automend-hackathon",
  storageBucket:"automend-hackathon.appspot.com",
  messagingSenderId:"247530183292",
  appId:"1:247530183292:web:f98560c12c52931ed747f9",
});
const db = firebase.firestore();

// ═══════════ STATE ═══════════
let allIncidents = [];
let unsubscribe = null;
let showHistory = false;
const SESSION_START = Date.now();
const RECENT_WINDOW_MS = 10 * 60 * 1000; // 10 minutes

// ═══════════ CONSTANTS ═══════════
const SERVICE_ID = "automend-target";
const TARGET_URL = "https://automend-target-247530183292.us-central1.run.app";
const STEPS = ["received","diagnosing","action_taken","verifying","recovered"];
const STEP_LABELS = {received:"Received",diagnosing:"Diagnosing",action_taken:"Action Executed",verifying:"Verifying",recovered:"Resolved"};
const FAILURE_LABELS = {
  crash_loop:{label:"Crash Loop",icon:"🔄",color:"text-orange-400 bg-orange-500/10 border-orange-500/20"},
  error_rate_spike:{label:"Error Spike",icon:"📈",color:"text-amber-400 bg-amber-500/10 border-amber-500/20"},
  memory_leak:{label:"Memory Leak",icon:"💾",color:"text-purple-400 bg-purple-500/10 border-purple-500/20"},
  bad_deploy:{label:"Bad Deploy",icon:"🚀",color:"text-red-400 bg-red-500/10 border-red-500/20"},
  health_check_failure:{label:"Health Check",icon:"❤️‍🩹",color:"text-pink-400 bg-pink-500/10 border-pink-500/20"},
  dependency_failure:{label:"Dependency",icon:"🔗",color:"text-cyan-400 bg-cyan-500/10 border-cyan-500/20"},
};
const STATUS_STYLES = {
  recovered:"bg-emerald-500/10 text-emerald-400 border border-emerald-500/20",
  failed:"bg-rose-500/10 text-rose-400 border border-rose-500/20",
  escalated:"bg-rose-500/10 text-rose-400 border border-rose-500/20",
  verifying:"bg-blue-500/10 text-blue-400 border border-blue-500/20 shimmer-active",
  action_taken:"bg-amber-500/10 text-amber-400 border border-amber-500/20 shimmer-active",
  diagnosing:"bg-violet-500/10 text-violet-400 border border-violet-500/20 shimmer-active",
  received:"bg-zinc-500/10 text-zinc-400 border border-zinc-500/20",
};

// ═══════════ HELPERS ═══════════
function toDate(d){if(!d)return null;if(d instanceof Date)return d;if(d?.toDate)return d.toDate();const x=new Date(d);return isNaN(x)?null:x;}
function timeAgo(d){const x=toDate(d);if(!x)return"—";const s=Math.floor((Date.now()-x.getTime())/1000);if(s<60)return s+"s ago";const m=Math.floor(s/60);if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";}
function isRecent(inc){const d=toDate(inc?.timestamps?.received);if(!d)return false;return(Date.now()-d.getTime())<RECENT_WINDOW_MS;}
function escHtml(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}
function syntaxHighlight(json){if(typeof json!=="string")json=JSON.stringify(json,null,2);return json.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"([^"]+)"(?=\s*:)/g,'<span class="json-key">"$1"</span>').replace(/:\s*"([^"]*)"/g,': <span class="json-string">"$1"</span>').replace(/:\s*(\d+\.?\d*)/g,': <span class="json-number">$1</span>').replace(/:\s*(true|false)/g,': <span class="json-bool">$1</span>').replace(/:\s*(null)/g,': <span class="json-null">$1</span>');}

// ═══════════ TOAST ═══════════
let toastTimer=null;
function showToast(msg,icon="✅"){
  clearTimeout(toastTimer);
  const inner=document.getElementById("toast-inner");
  document.getElementById("toast-icon").textContent=icon;
  document.getElementById("toast-text").textContent=msg;
  inner.classList.remove("opacity-0","translate-y-2");
  inner.classList.add("opacity-100","translate-y-0");
  toastTimer=setTimeout(()=>{inner.classList.add("opacity-0","translate-y-2");inner.classList.remove("opacity-100","translate-y-0");},3500);
}

// ═══════════ STATS ═══════════
function updateStats(visible){
  const total=visible.length;
  const recovered=visible.filter(i=>i.status==="recovered").length;
  const active=visible.filter(i=>!["recovered","failed","escalated"].includes(i.status)).length;
  const revisions=new Set(visible.map(i=>i.failure_event?.revision_id).filter(Boolean)).size;
  document.getElementById("stat-active").textContent=active;
  document.getElementById("stat-recovery").textContent=total>0?Math.round((recovered/total)*100)+"%":"—";
  const heals=visible.filter(i=>i.status==="recovered").map(i=>{const s=toDate(i.timestamps?.received),e=toDate(i.timestamps?.recovered);return s&&e?Math.round((e-s)/1000):null;}).filter(Boolean);
  document.getElementById("stat-heal-time").textContent=heals.length?(()=>{const a=Math.round(heals.reduce((x,y)=>x+y,0)/heals.length);return a<60?a+"s":Math.round(a/60)+"m";})():"—";
  document.getElementById("stat-revisions").textContent=revisions;
}

// ═══════════ RENDER ═══════════
function getStepIndex(s){const o=["received","diagnosing","action_taken","verifying","recovered","failed","escalated"];return Math.max(0,o.indexOf(s));}
function renderStepper(status){
  const ci=getStepIndex(status),term=["recovered","failed","escalated"].includes(status),p=term?100:Math.min((ci/(STEPS.length-1))*100,100);
  return`<div class="relative mt-3 mb-1"><div class="h-0.5 w-full bg-zinc-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-500 to-emerald-400 rounded-full step-bar" style="width:${p}%"></div></div><div class="flex justify-between mt-1.5">${STEPS.map((s,i)=>{const done=i<ci||(term&&i<=ci),active=i===ci;return`<span class="text-[9px] font-medium ${done?"text-zinc-400":"text-zinc-600"} ${active?"text-zinc-200":""}">${STEP_LABELS[s]}</span>`;}).join("")}</div></div>`;
}
function renderIncident(inc,id){
  const fe=inc.failure_event||{},rd=inc.recovery_decision||{},at=inc.action_taken||{},ts=inc.timestamps||{};
  const ft=fe.failure_type||"unknown",fti=FAILURE_LABELS[ft]||{label:ft,icon:"❓",color:"text-zinc-400 bg-zinc-500/10 border-zinc-500/20"};
  const ss=STATUS_STYLES[inc.status]||STATUS_STYLES.received;
  const conf=rd.confidence!=null?Math.round(rd.confidence*100)+"%":"—";
  const sl=(inc.status||"received").replace(/_/g," ");
  return`<div class="animate-fade-in rounded-xl border border-zinc-800/80 bg-zinc-900/50 backdrop-blur-sm hover:border-zinc-700/80 transition-all duration-200 overflow-hidden">
    <div class="px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3 min-w-0">
        <code class="text-xs font-mono text-zinc-500 truncate">${(id||"—").substring(0,12)}</code>
        <span class="text-[10px] text-zinc-600">${timeAgo(ts.received)}</span>
        <span class="inline-flex items-center gap-1 rounded-md border px-2 py-0.5 text-[11px] font-medium ${fti.color}">${fti.icon} ${fti.label}</span>
      </div>
      <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${ss}">${sl}</span>
    </div>
    <div class="px-4 pb-2">${renderStepper(inc.status)}</div>
    ${rd.diagnosed_cause||rd.reasoning?`<div class="mx-4 mb-3 rounded-lg border border-zinc-800/60 bg-zinc-950/50 p-3">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="inline-flex items-center rounded bg-violet-500/10 border border-violet-500/20 px-1.5 py-0.5 text-[9px] font-semibold text-violet-400 uppercase tracking-wider">Gemini</span>
        <span class="text-[10px] text-zinc-500">AI Diagnosis</span>
        <span class="ml-auto text-[10px] font-mono text-zinc-500">${conf}</span>
      </div>
      ${rd.diagnosed_cause?`<p class="text-xs text-zinc-300 font-medium">${escHtml(rd.diagnosed_cause)}</p>`:""}
      ${rd.reasoning?`<p class="text-[11px] text-zinc-500 mt-1 leading-relaxed">${escHtml(rd.reasoning)}</p>`:""}
    </div>`:""}
    ${at.action||rd.chosen_action?`<div class="mx-4 mb-3 flex items-center gap-2 flex-wrap">
      <span class="text-[10px] text-zinc-600 uppercase tracking-wider font-medium">Action</span>
      <code class="text-[11px] font-mono text-amber-400/80">${at.action||rd.chosen_action||"—"}</code>
      ${at.success===true?'<span class="text-[10px] text-emerald-500">✓ success</span>':""}
      ${at.success===false?'<span class="text-[10px] text-rose-400">✗ failed</span>':""}
      ${at.error?`<span class="text-[10px] text-rose-400/70 truncate max-w-xs" title="${escHtml(at.error)}">${escHtml(at.error.substring(0,80))}</span>`:""}
    </div>`:""}
    <div class="border-t border-zinc-800/60">
      <button onclick="toggleJson('${id}')" class="w-full px-4 py-2 flex items-center gap-2 text-[11px] text-zinc-500 hover:text-zinc-400 transition-colors">
        <i data-lucide="code-2" class="h-3 w-3"></i>Raw Payload
        <i data-lucide="chevron-down" class="h-3 w-3 ml-auto transition-transform" id="chevron-${id}"></i>
      </button>
      <div id="json-${id}" class="hidden px-4 pb-3 max-h-64 overflow-y-auto">
        <pre class="text-[10px] font-mono leading-relaxed text-zinc-500 whitespace-pre-wrap">${syntaxHighlight(JSON.stringify(inc,(k,v)=>v&&typeof v==="object"&&v.toDate?v.toDate().toISOString():v,2))}</pre>
      </div>
    </div>
  </div>`;
}
function toggleJson(id){const el=document.getElementById("json-"+id),ch=document.getElementById("chevron-"+id);if(el){el.classList.toggle("hidden");if(ch)ch.style.transform=el.classList.contains("hidden")?"":"rotate(180deg)";}}

function renderAll(){
  const container=document.getElementById("incidents-container");
  const emptyState=document.getElementById("empty-state");
  // Filter: show recent by default, all if history toggle is on
  const visible=showHistory?allIncidents:allIncidents.filter(isRecent);
  if(visible.length===0){emptyState.classList.remove("hidden");container.classList.add("hidden");updateStats([]);return;}
  emptyState.classList.add("hidden");container.classList.remove("hidden");
  visible.sort((a,b)=>{const ta=toDate(a.timestamps?.received)||new Date(0),tb=toDate(b.timestamps?.received)||new Date(0);return tb-ta;});
  container.innerHTML=visible.map((inc,i)=>renderIncident(inc,inc._id||"inc-"+i)).join("");
  lucide.createIcons();
  updateStats(visible);
}

// ═══════════ FIRESTORE ═══════════
function startListening(){
  const q=db.collection("services").doc(SERVICE_ID).collection("incidents").limit(100);
  unsubscribe=q.onSnapshot(
    snap=>{if(!snap.empty){processSnapshot(snap);return;}fallbackListening();},
    err=>{console.warn("Primary failed:",err.message);fallbackListening();}
  );
}
function fallbackListening(){
  if(unsubscribe)unsubscribe();
  const q=db.collectionGroup("incidents").limit(100);
  unsubscribe=q.onSnapshot(
    snap=>processSnapshot(snap),
    err=>{console.error("Fallback failed:",err.message);document.getElementById("empty-state").querySelector("p").textContent="Firestore query error";}
  );
}
function processSnapshot(snap){
  allIncidents=[];
  snap.forEach(doc=>{const d=doc.data();d._id=doc.id;const p=doc.ref.parent.parent;if(p)d._service_id=p.id;allIncidents.push(d);});
  renderAll();
}

// ═══════════ TRIGGERS ═══════════
async function triggerFailure(type){
  const endpoint=type==="reset"?"/debug/reset":"/debug/error-spike";
  const btnId=type==="reset"?"btn-reset":"btn-error-spike";
  const btn=document.getElementById(btnId);
  btn.disabled=true;
  const icon=btn.querySelector("[data-lucide]");
  const spinIcon=btn.querySelectorAll("[data-lucide]")[1];
  if(icon)icon.classList.add("hidden");
  if(spinIcon){spinIcon.classList.remove("hidden");spinIcon.classList.add("animate-spin");}

  try{
    // Try CORS first
    const resp=await fetch(TARGET_URL+endpoint,{method:"POST",headers:{"Content-Type":"application/json"},mode:"cors"});
    const data=await resp.json();
    showToast(data.status||(type==="reset"?"Service reset to healthy state":"Error spike injected"),"⚡");
  }catch(e){
    // CORS might be blocked — try no-cors as fallback (opaque response, but endpoint still fires)
    try{
      await fetch(TARGET_URL+endpoint,{method:"POST",mode:"no-cors"});
      showToast(type==="reset"?"Reset sent to target service":"Error spike sent to target service","⚡");
    }catch(e2){
      showToast("Failed to reach target service","❌");
    }
  }finally{
    btn.disabled=false;
    if(icon)icon.classList.remove("hidden");
    if(spinIcon){spinIcon.classList.add("hidden");spinIcon.classList.remove("animate-spin");}
  }
}

function toggleHistory(){
  showHistory=!showHistory;
  const btn=document.getElementById("btn-history");
  if(showHistory){
    btn.classList.add("border-amber-800/50","text-amber-400");
    btn.classList.remove("text-zinc-500");
  }else{
    btn.classList.remove("border-amber-800/50","text-amber-400");
    btn.classList.add("text-zinc-500");
  }
  renderAll();
}

// ═══════════ INIT ═══════════
document.addEventListener("DOMContentLoaded",()=>{lucide.createIcons();startListening();});
window.addEventListener("beforeunload",()=>{if(unsubscribe)unsubscribe();});
</script>
</body>
</html>
