name: Deploy Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "services/orchestrator/**"
  workflow_dispatch:

env:
  PROJECT_ID: automend-hackathon
  REGION: us-central1
  SERVICE_NAME: automend-orchestrator
  SERVICE_ACCOUNT: automend-orchestrator@automend-hackathon.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./services/orchestrator \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars "GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }}"

      - name: Print service URL
        run: |
          echo "Orchestrator deployed!"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)"
